<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights | Irfan Fitrat</title>
  <meta name="description" content="Thoughts on opportunity, connection and growth. Sharing ideas and lessons from building bridges between Pakistan, the UAE and the world." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    h1, h2, h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 600; }

    /* Simple nav matching your site */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      z-index: 50;
    }
    .nav-logo {
      font-family: 'Newsreader', serif;
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
      color: var(--text);
    }
    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }

    /* Hero */
    .hero {
      background: #0a0a0a;
      color: white;
      padding: 100px 40px 90px;
      text-align: left;
    }
    .hero-inner { max-width: 900px; margin: 0 auto; }
    .hero .label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      line-height: 1.15;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .hero p {
      font-size: 1.1rem;
      color: #94a3b8;
      max-width: 540px;
      line-height: 1.7;
    }

    /* Articles grid */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 40px 100px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px;
    }
    .card {
      text-decoration: none;
      color: inherit;
      display: block;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.25s, box-shadow 0.25s;
      background: white;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(15,23,42,0.08);
    }
    .card-image {
      aspect-ratio: 16/10;
      background: #f1f5f9;
      overflow: hidden;
    }
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-body { padding: 22px; }
    .card-meta {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
    }
    .card-meta .date { color: var(--muted); font-weight: 500; }
    .card h2 {
      font-size: 1.25rem;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .card p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 40px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .nav { padding: 14px 20px; }
      .nav-links { display: none; }
      .hero { padding: 70px 24px 60px; }
      .section { padding: 50px 24px 70px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">IRFAN FITRAT</a>
    <ul class="nav-links">
      <li><a href="/#world">World</a></li>
      <li><a href="/#bridge">Mission</a></li>
      <li><a href="/#ventures">Ventures</a></li>
      <li><a href="/invest.html">Invest</a></li>
      <li><a href="/insights" class="active">Insights</a></li>
      <li><a href="/thoughts">Thoughts</a></li>
      <li><a href="/#contact">Connect</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-inner">
      <div class="label">Insights</div>
      <h1>Thoughts on opportunity,<br>connection and growth.</h1>
      <p>Sharing ideas, observations and lessons from building bridges between Pakistan, the UAE and the world.</p>
    </div>
  </section>

  <section class="section">
    <div class="grid" id="articlesGrid">
      <div class="loading">Loading articles…</div>
    </div>
  </section>

  <footer>
    © <span id="year"></span> Irfan Fitrat
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Change this to your Worker URL after deploying
    const API_BASE = "https://insights-api.irfanfitratyousafzai.workers.dev";

    async function loadArticles() {
      const grid = document.getElementById("articlesGrid");
      try {
        const res = await fetch(API_BASE + "/api/articles");
        const articles = await res.json();

        if (!articles.length) {
          grid.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
              <p>New insights coming soon.</p>
            </div>`;
          return;
        }

        grid.innerHTML = articles.map(a => `
          <a href="/insight.html?slug=${encodeURIComponent(a.slug)}" class="card">
            <div class="card-image">
              ${a.cover_image
                ? `<img src="${a.cover_image}" alt="${escapeHtml(a.title)}" loading="lazy" />`
                : `<div style="width:100%;height:100%;background:linear-gradient(135deg,#0f172a,#0f766e);"></div>`
              }
            </div>
            <div class="card-body">
              <div class="card-meta">
                <span>${escapeHtml(a.category || "Insight")}</span>
                <span class="date">${a.published_at ? formatDate(a.published_at) : ""}</span>
              </div>
              <h2>${escapeHtml(a.title)}</h2>
              <p>${escapeHtml(a.excerpt || "")}</p>
            </div>
          </a>
        `).join("");
      } catch (e) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><p>Unable to load articles.</p></div>`;
      }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleDateString("en-US", { month: "short", year: "numeric" }).toUpperCase();
      } catch { return ""; }
    }

    loadArticles();
  </script>
</body>
</html>
