<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Thoughts | Irfan Fitrat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #111111;
      --white: #ffffff;
      --soft: #f5f5f2;
      --grey: #777777;
      --line: #e5e5e5;
      --green: #16a34a;
      --red: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #fafafa; color: var(--black); line-height: 1.5; }

    .admin-header {
      background: white;
      border-bottom: 1px solid var(--line);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-header h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .admin-header a {
      font-size: 13px;
      color: var(--grey);
      text-decoration: none;
    }
    .admin-header a:hover { color: var(--black); }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 40px 100px;
    }

    .admin-tabs {
      display: flex;
      gap: 32px;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--line);
    }
    .admin-tab {
      padding: 12px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--grey);
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
    }
    .admin-tab.active { color: var(--black); }
    .admin-tab.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--black);
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .card-header h2 { font-size: 18px; font-weight: 500; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="url"],
    input[type="datetime-local"],
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 15px;
      margin-bottom: 20px;
      background: white;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #999;
    }
    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 22px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--black); color: white; }
    .btn-primary:hover { background: #333; }
    .btn-outline {
      background: white;
      border: 1px solid var(--line);
      color: var(--black);
    }
    .btn-outline:hover { border-color: #999; }
    .btn-danger {
      background: white;
      border: 1px solid #fecaca;
      color: var(--red);
    }
    .btn-danger:hover { background: #fef2f2; }
    .btn-sm { padding: 7px 14px; font-size: 12px; }

    .post-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    .post-item:last-child { border-bottom: none; }
    .post-info h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .post-meta { font-size: 13px; color: var(--grey); }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 100px;
      text-transform: uppercase;
    }
    .badge-published { background: #dcfce7; color: #166534; }
    .badge-draft { background: #f3f4f6; color: #4b5563; }
    .badge-pending { background: #fef3c7; color: #92400e; }

    .actions { display: flex; gap: 10px; }

    .comment-item {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .comment-author { font-weight: 500; font-size: 14px; }
    .comment-email { font-size: 13px; color: var(--grey); }
    .comment-content { font-size: 15px; margin: 10px 0 14px; line-height: 1.6; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--grey);
    }
    .panel { display: none; }
    .panel.active { display: block; }

    @media (max-width: 768px) {
      .admin-container { padding: 24px 20px 80px; }
      .admin-header { padding: 16px 20px; }
      .form-row { grid-template-columns: 1fr; }
      .post-item { flex-direction: column; align-items: flex-start; gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="admin-header">
    <h1>Thoughts Admin</h1>
    <div style="display:flex; gap:24px; align-items:center;">
      <a href="/thoughts.html" target="_blank">View Public Page →</a>
      <a href="/">← Back to Website</a>
    </div>
  </div>

  <div class="admin-container">
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="posts">Posts</button>
      <button class="admin-tab" data-tab="create">Create New</button>
      <button class="admin-tab" data-tab="comments">Comments</button>
    </div>

    <!-- POSTS LIST -->
    <div id="panel-posts" class="panel active">
      <div class="card">
        <div class="card-header">
          <h2>All Thoughts</h2>
          <button class="btn btn-primary btn-sm" onclick="switchTab('create')">+ New Thought</button>
        </div>
        <div id="posts-list">
          <div class="empty-state"><p>Loading posts...</p></div>
        </div>
      </div>
    </div>

    <!-- CREATE / EDIT -->
    <div id="panel-create" class="panel">
      <div class="card">
        <div class="card-header">
          <h2 id="form-title">Create New Thought</h2>
        </div>
        <form id="post-form">
          <input type="hidden" id="post-id">
          <label>Title</label>
          <input type="text" id="title" placeholder="Write a clear title..." required>
          <label>Slug (URL)</label>
          <input type="text" id="slug" placeholder="auto-generated-from-title" required>
          <label>Excerpt</label>
          <textarea id="excerpt" style="min-height:90px" placeholder="Short summary..."></textarea>
          <label>Content</label>
          <textarea id="content" placeholder="Write your thought here..." required></textarea>
          <div class="form-row">
            <div>
              <label>Cover Image URL (optional)</label>
              <input type="url" id="cover_image" placeholder="https://...">
            </div>
            <div>
              <label>Tags (comma separated)</label>
              <input type="text" id="tags" placeholder="business, pakistan">
            </div>
          </div>
          <div class="form-row">
            <div>
              <label>Status</label>
              <select id="status">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
              </select>
            </div>
            <div>
              <label>Publish Date</label>
              <input type="datetime-local" id="published_at">
            </div>
          </div>
          <div style="display:flex; gap:12px; margin-top:10px;">
            <button type="submit" class="btn btn-primary">Save Thought</button>
            <button type="button" class="btn btn-outline" onclick="resetForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- COMMENTS -->
    <div id="panel-comments" class="panel">
      <div class="card">
        <div class="card-header">
          <h2>Comment Moderation</h2>
          <select id="comment-filter" style="width:auto; margin:0; padding:8px 12px;">
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="all">All</option>
          </select>
        </div>
        <div id="comments-list">
          <div class="empty-state"><p>Loading comments...</p></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://thoughts-api.irfanfitratyousafzai.workers.dev";
    const ADMIN_TOKEN = "FAKESECRET_c1d2e3f4g5h6i7j8k9l0";

    function switchTab(tabName) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(`panel-${tabName}`).classList.add('active');
      if (tabName === 'posts') loadPosts();
      if (tabName === 'comments') loadComments();
    }

    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    async function loadPosts() {
      const container = document.getElementById('posts-list');
      try {
        const res = await fetch(`${API_BASE}/api/admin/posts`, {
          headers: { "Authorization": `Bearer ${ADMIN_TOKEN}` }
        });
        const posts = await res.json();

        if (!posts.length) {
          container.innerHTML = `<div class="empty-state"><p>No thoughts yet.</p>
            <button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="switchTab('create')">Create your first thought</button></div>`;
          return;
        }

        container.innerHTML = posts.map(post => `
          <div class="post-item">
            <div class="post-info">
              <h3>${escapeHtml(post.title)}</h3>
              <div class="post-meta">
                <span class="badge ${post.status === 'published' ? 'badge-published' : 'badge-draft'}">${post.status}</span>
                &nbsp;·&nbsp; ${formatDate(post.published_at || post.created_at)}
                ${post.slug ? `&nbsp;·&nbsp; /thoughts/${post.slug}` : ''}
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-outline btn-sm" onclick="editPost('${post.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deletePost('${post.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>Error loading posts</p></div>`;
      }
    }

    async function editPost(id) {
      const res = await fetch(`${API_BASE}/api/admin/posts`, {
        headers: { "Authorization": `Bearer ${ADMIN_TOKEN}` }
      });
      const posts = await res.json();
      const post = posts.find(p => p.id === id);
      if (!post) return;

      document.getElementById('post-id').value = post.id;
      document.getElementById('title').value = post.title;
      document.getElementById('slug').value = post.slug;
      document.getElementById('excerpt').value = post.excerpt || '';
      document.getElementById('content').value = post.content;
      document.getElementById('cover_image').value = post.cover_image || '';
      document.getElementById('tags').value = post.tags || '';
      document.getElementById('status').value = post.status;
      document.getElementById('published_at').value = post.published_at ? post.published_at.slice(0, 16) : '';
      document.getElementById('form-title').textContent = 'Edit Thought';
      switchTab('create');
    }

    async function deletePost(id) {
      if (!confirm('Delete this thought permanently?')) return;
      await fetch(`${API_BASE}/api/admin/posts/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${ADMIN_TOKEN}` }
      });
      loadPosts();
    }

    function resetForm() {
      document.getElementById('post-form').reset();
      document.getElementById('post-id').value = '';
      document.getElementById('form-title').textContent = 'Create New Thought';
      switchTab('posts');
    }

    document.getElementById('title').addEventListener('input', function() {
      if (document.getElementById('post-id').value) return;
      const slug = this.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      document.getElementById('slug').value = slug;
    });

    document.getElementById('post-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const id = document.getElementById('post-id').value;
      const data = {
        title: document.getElementById('title').value.trim(),
        slug: document.getElementById('slug').value.trim(),
        excerpt: document.getElementById('excerpt').value.trim(),
        content: document.getElementById('content').value.trim(),
        cover_image: document.getElementById('cover_image').value.trim(),
        tags: document.getElementById('tags').value.trim(),
        status: document.getElementById('status').value,
        published_at: document.getElementById('published_at').value || null
      };

      const url = id ? `${API_BASE}/api/admin/posts/${id}` : `${API_BASE}/api/admin/posts`;
      const method = id ? "PUT" : "POST";

      const res = await fetch(url, {
        method,
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${ADMIN_TOKEN}`
        },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        alert("Thought saved successfully!");
        resetForm();
        loadPosts();
      } else {
        alert("Error saving thought");
      }
    });

    async function loadComments() {
      const filter = document.getElementById('comment-filter').value;
      const container = document.getElementById('comments-list');
      try {
        const res = await fetch(`${API_BASE}/api/admin/comments?status=${filter}`, {
          headers: { "Authorization": `Bearer ${ADMIN_TOKEN}` }
        });
        const comments = await res.json();

        if (!comments.length) {
          container.innerHTML = `<div class="empty-state"><p>No comments found.</p></div>`;
          return;
        }

        container.innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-header">
              <div>
                <span class="comment-author">${escapeHtml(c.name)}</span>
                <span class="comment-email"> · ${escapeHtml(c.email)}</span>
              </div>
              <span class="badge badge-${c.status}">${c.status}</span>
            </div>
            <div class="comment-content">${escapeHtml(c.content)}</div>
            <div class="actions">
              ${c.status !== 'approved' ? `<button class="btn btn-primary btn-sm" onclick="updateComment('${c.id}', 'approved')">Approve</button>` : ''}
              ${c.status !== 'rejected' ? `<button class="btn btn-outline btn-sm" onclick="updateComment('${c.id}', 'rejected')">Reject</button>` : ''}
              <button class="btn btn-danger btn-sm" onclick="deleteComment('${c.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>Error loading comments</p></div>`;
      }
    }

    document.getElementById('comment-filter').addEventListener('change', loadComments);

    async function updateComment(id, status) {
      await fetch(`${API_BASE}/api/admin/comments/${id}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${ADMIN_TOKEN}`
        },
        body: JSON.stringify({ status })
      });
      loadComments();
    }

    async function deleteComment(id) {
      if (!confirm('Delete this comment?')) return;
      await fetch(`${API_BASE}/api/admin/comments/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${ADMIN_TOKEN}` }
      });
      loadComments();
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    loadPosts();
  </script>
</body>
</html>
