<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compose | Thoughts Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #161616;
      --border: #2f2f2f;
      --text: #e7e9ea;
      --muted: #71767b;
      --hover: #1a1a1a;
      --accent: #1d9bf0;
      --green: #00ba7c;
      --red: #f4212e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15,15,15,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 53px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title { font-size: 18px; font-weight: 700; }

    .header-links {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }

    .header-links a {
      color: var(--muted);
      text-decoration: none;
    }
    .header-links a:hover { color: var(--text); }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
    }
    .tab.active { color: var(--text); }
    .tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Composer */
    .composer {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .composer-body { flex: 1; }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 19px;
      line-height: 1.4;
      resize: none;
      outline: none;
      min-height: 90px;
      padding: 8px 0;
    }

    textarea::placeholder { color: var(--muted); }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }

    .composer-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--accent);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(29,155,240,0.1); }

    .char-count {
      font-size: 13px;
      color: var(--muted);
      margin-right: 12px;
    }

    .post-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .post-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .post-btn:hover:not(:disabled) { opacity: 0.9; }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Posts List */
    .post-item {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .post-info h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .post-meta {
      font-size: 13px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-published { background: rgba(0,186,124,0.15); color: var(--green); }
    .badge-draft { background: rgba(113,118,123,0.2); color: var(--muted); }

    .actions { display: flex; gap: 8px; }
    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-sm:hover { background: var(--hover); }
    .btn-danger { color: var(--red); border-color: rgba(244,33,46,0.4); }

    /* Comments */
    .comment-item {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .comment-author { font-weight: 600; font-size: 14px; }
    .comment-email { font-size: 13px; color: var(--muted); }
    .comment-content { font-size: 14px; line-height: 1.45; margin: 8px 0 12px; }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .status-msg {
      padding: 10px 16px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .status-msg.success { background: rgba(0,186,124,0.15); color: var(--green); display: block; }
    .status-msg.error { background: rgba(244,33,46,0.15); color: var(--red); display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-title">Thoughts Admin</div>
      <div class="header-links">
        <a href="/thoughts.html" target="_blank">View Feed</a>
        <a href="/">Website</a>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="compose">Compose</button>
      <button class="tab" data-tab="posts">Posts</button>
      <button class="tab" data-tab="comments">Comments</button>
    </div>

    <div id="status-msg" class="status-msg"></div>

    <!-- COMPOSE TAB -->
    <div id="panel-compose" class="panel active">
      <div class="composer">
        <div class="avatar">IF</div>
        <div class="composer-body">
          <textarea id="thought-input" placeholder="What's on your mind?" rows="3"></textarea>
          <div class="composer-footer">
            <div class="composer-actions">
              <button class="icon-btn" title="Add image" onclick="alert('Image upload coming soon')">🖼️</button>
              <button class="icon-btn" title="Add emoji" onclick="addEmoji()">😊</button>
            </div>
            <div style="display:flex; align-items:center;">
              <span class="char-count" id="char-count">0</span>
              <button class="post-btn" id="post-btn" disabled>Post</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- POSTS TAB -->
    <div id="panel-posts" class="panel">
      <div id="posts-list">
        <div class="empty">Loading posts...</div>
      </div>
    </div>

    <!-- COMMENTS TAB -->
    <div id="panel-comments" class="panel">
      <div style="padding:12px 16px; border-bottom:1px solid var(--border);">
        <select id="comment-filter" style="background:var(--card); color:var(--text); border:1px solid var(--border); padding:6px 10px; border-radius:6px; font-size:13px;">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="all">All</option>
        </select>
      </div>
      <div id="comments-list">
        <div class="empty">Loading comments...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://thoughts-api.irfanfitratyousafzai.workers.dev";
    const ADMIN_TOKEN = "FAKESECRET_c1d2e3f4g5h6i7j8k9l0";

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
        if (tab.dataset.tab === 'posts') loadPosts();
        if (tab.dataset.tab === 'comments') loadComments();
      });
    });

    // Composer
    const input = document.getElementById('thought-input');
    const postBtn = document.getElementById('post-btn');
    const charCount = document.getElementById('char-count');

    input.addEventListener('input', () => {
      const len = input.value.trim().length;
      charCount.textContent = len;
      postBtn.disabled = len === 0;
      // Auto grow
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    });

    function addEmoji() {
      const emojis = ['😊','🔥','💡','🚀','✨','💪','🌍','📈','🤝','🎯'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      input.value += emoji;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }

    postBtn.addEventListener('click', async () => {
      const content = input.value.trim();
      if (!content) return;

      postBtn.disabled = true;
      postBtn.textContent = 'Posting...';

      // Create a simple slug from first few words
      const slug = content
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '')
        .substring(0, 60) + '-' + Date.now().toString().slice(-4);

      const data = {
        title: content.substring(0, 80) + (content.length > 80 ? '...' : ''),
        slug: slug,
        content: content,
        excerpt: content.substring(0, 160),
        status: 'published',
        published_at: new Date().toISOString()
      };

      try {
        const res = await fetch(`${API_BASE}/api/admin/posts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${ADMIN_TOKEN}`
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          showStatus('Thought published!', 'success');
          input.value = '';
          input.style.height = 'auto';
          charCount.textContent = '0';
          postBtn.textContent = 'Post';
          postBtn.disabled = true;
        } else {
          showStatus('Failed to post', 'error');
          postBtn.textContent = 'Post';
          postBtn.disabled = false;
        }
      } catch (err) {
        showStatus('Error connecting to server', 'error');
        postBtn.textContent = 'Post';
        postBtn.disabled = false;
      }
    });

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = `status-msg ${type}`;
      setTimeout(() => el.className = 'status-msg', 3000);
    }

    // Load Posts
    async function loadPosts() {
      const container = document.getElementById('posts-list');
      try {
        const res = await fetch(`${API_BASE}/api/admin/posts`, {
          headers: { 'Authorization': `Bearer ${ADMIN_TOKEN}` }
        });
        const posts = await res.json();

        if (!posts.length) {
          container.innerHTML = `<div class="empty">No thoughts yet</div>`;
          return;
        }

        container.innerHTML = posts.map(p => `
          <div class="post-item">
            <div class="post-info">
              <h3>${escapeHtml(p.title)}</h3>
              <div class="post-meta">
                <span class="badge ${p.status === 'published' ? 'badge-published' : 'badge-draft'}">${p.status}</span>
                · ${formatDate(p.published_at || p.created_at)}
              </div>
            </div>
            <div class="actions">
              <button class="btn-sm btn-danger" onclick="deletePost('${p.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty">Error loading posts</div>`;
      }
    }

    async function deletePost(id) {
      if (!confirm('Delete this thought?')) return;
      await fetch(`${API_BASE}/api/admin/posts/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${ADMIN_TOKEN}` }
      });
      loadPosts();
    }

    // Comments
    async function loadComments() {
      const filter = document.getElementById('comment-filter').value;
      const container = document.getElementById('comments-list');
      try {
        const res = await fetch(`${API_BASE}/api/admin/comments?status=${filter}`, {
          headers: { 'Authorization': `Bearer ${ADMIN_TOKEN}` }
        });
        const comments = await res.json();

        if (!comments.length) {
          container.innerHTML = `<div class="empty">No comments</div>`;
          return;
        }

        container.innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-header">
              <div>
                <span class="comment-author">${escapeHtml(c.name)}</span>
                <span class="comment-email"> · ${escapeHtml(c.email)}</span>
              </div>
              <span class="badge">${c.status}</span>
            </div>
            <div class="comment-content">${escapeHtml(c.content)}</div>
            <div class="actions">
              ${c.status !== 'approved' ? `<button class="btn-sm" onclick="updateComment('${c.id}','approved')">Approve</button>` : ''}
              ${c.status !== 'rejected' ? `<button class="btn-sm" onclick="updateComment('${c.id}','rejected')">Reject</button>` : ''}
              <button class="btn-sm btn-danger" onclick="deleteComment('${c.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty">Error loading comments</div>`;
      }
    }

    document.getElementById('comment-filter').addEventListener('change', loadComments);

    async function updateComment(id, status) {
      await fetch(`${API_BASE}/api/admin/comments/${id}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${ADMIN_TOKEN}`
        },
        body: JSON.stringify({ status })
      });
      loadComments();
    }

    async function deleteComment(id) {
      if (!confirm('Delete comment?')) return;
      await fetch(`${API_BASE}/api/admin/comments/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${ADMIN_TOKEN}` }
      });
      loadComments();
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function formatDate(str) {
      if (!str) return '';
      return new Date(str).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
