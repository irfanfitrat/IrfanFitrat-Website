<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insight | Irfan Fitrat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      line-height: 1.7;
      background: #fff;
    }
    h1, h2, h3 { font-family: 'Newsreader', Georgia, serif; }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
    }
    .nav a {
      text-decoration: none;
      color: var(--text);
      font-family: 'Newsreader', serif;
      font-weight: 600;
    }
    .nav .back {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .article-header {
      max-width: 720px;
      margin: 0 auto;
      padding: 70px 24px 40px;
      text-align: center;
    }
    .article-header .meta {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .article-header h1 {
      font-size: clamp(2rem, 4.5vw, 3rem);
      line-height: 1.2;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .article-header .excerpt {
      font-size: 1.15rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 580px;
      margin: 0 auto;
    }

    .cover {
      max-width: 960px;
      margin: 0 auto 50px;
      padding: 0 24px;
    }
    .cover img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .content {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 80px;
      font-size: 1.1rem;
    }
    .content h2 {
      font-size: 1.6rem;
      margin: 2.2em 0 0.7em;
    }
    .content h3 {
      font-size: 1.3rem;
      margin: 1.8em 0 0.6em;
    }
    .content p { margin-bottom: 1.4em; }
    .content ul, .content ol {
      margin: 0 0 1.4em 1.4em;
    }
    .content li { margin-bottom: 0.4em; }
    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 20px;
      margin: 1.8em 0;
      color: var(--muted);
      font-style: italic;
    }
    .content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 1.5em 0;
    }
    .content a { color: var(--accent); }

    .loading, .error {
      text-align: center;
      padding: 100px 24px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .nav { padding: 14px 20px; }
      .article-header { padding: 50px 20px 30px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/">IRFAN FITRAT</a>
    <a href="/insights" class="back">← Insights</a>
  </nav>

  <div id="app">
    <div class="loading">Loading article…</div>
  </div>

  <script>
    const API_BASE = "https://insights-api.irfanfitratyousafzai.workers.dev";

    async function load() {
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug");
      const app = document.getElementById("app");

      if (!slug) {
        app.innerHTML = `<div class="error">Article not found.</div>`;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/articles/${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error("Not found");
        const a = await res.json();

        document.title = `${a.title} | Irfan Fitrat`;

        app.innerHTML = `
          <header class="article-header">
            <div class="meta">
              ${escapeHtml(a.category || "Insight")}
              ${a.published_at ? " · " + formatDate(a.published_at) : ""}
            </div>
            <h1>${escapeHtml(a.title)}</h1>
            ${a.excerpt ? `<p class="excerpt">${escapeHtml(a.excerpt)}</p>` : ""}
          </header>
          ${a.cover_image ? `
            <div class="cover">
              <img src="${a.cover_image}" alt="" />
            </div>` : ""}
          <div class="content">
            ${a.content || ""}
          </div>
        `;
      } catch (e) {
        app.innerHTML = `<div class="error">Article not found.</div>`;
      }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleDateString("en-US", {
          month: "long", day: "numeric", year: "numeric"
        });
      } catch { return ""; }
    }

    load();
  </script>
</body>
</html>
