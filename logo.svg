<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- Definitions for consistent styling -->
  <style>
    .main-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 105px;
      fill: #303030;
    }
    .sub-text {
      font-family: 'Arial', sans-serif;
      font-size: 20px;
      fill: #303030;
      letter-spacing: 2px;
    }
    .icon-stroke {
      stroke: #303030;
      stroke-width: 2.5;
      stroke-linejoin: miter;
    }
    .line-stroke {
      stroke: #303030;
      stroke-width: 1.5;
    }
  </style>

  <!-- Main Text Left -->
  <text x="185" y="115" class="main-text" text-anchor="end">IRF</text>

  <!-- Center "A" Icon (Now Yellow) -->
  <!-- Left Triangle -->
  <polygon points="250,22 195,115 250,82" fill="#FFD700" class="icon-stroke" />
  
  <!-- Right Triangle -->
  <polygon points="250,22 305,115 250,82" fill="#FFD700" class="icon-stroke" />

  <!-- Main Text Right -->
  <text x="315" y="115" class="main-text" text-anchor="start">N</text>

  <!-- Bottom Subtext -->
  <text x="250" y="152" class="sub-text" text-anchor="middle">FITRAT</text>

  <!-- Horizontal Lines -->
  <line x1="90" y1="145" x2="205" y2="145" class="line-stroke" />
  <line x1="295" y1="145" x2="410" y2="145" class="line-stroke" />
</svg>
