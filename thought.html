<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought | Irfan Fitrat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #111;
      --border: #222;
      --text: #e7e9ea;
      --muted: #6e767d;
      --hover: #161616;
      --accent: #1d9bf0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .back-btn {
      color: var(--text); text-decoration: none; font-size: 18px;
      width: 34px; height: 34px; display: flex; align-items: center;
      justify-content: center; border-radius: 50%; transition: background 0.2s;
    }
    .back-btn:hover { background: var(--hover); }
    .header-title { font-size: 19px; font-weight: 700; }

    .thought { padding: 20px 16px; border-bottom: 1px solid var(--border); }
    .thought-header { display: flex; gap: 12px; margin-bottom: 16px; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #1d9bf0, #0d7cc7);
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 17px; flex-shrink: 0;
    }
    .user-meta { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .name { font-weight: 700; font-size: 16px; }
    .handle { font-size: 14px; color: var(--muted); }

    .thought-content {
      font-size: 18px; line-height: 1.55; white-space: pre-wrap;
      word-break: break-word; margin-bottom: 16px;
    }

    .thought-image {
      margin-bottom: 16px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .thought-image img { width: 100%; height: auto; display: block; }

    .thought-time {
      font-size: 14px; color: var(--muted);
      padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
    }
    .thought-stats { font-size: 14px; color: var(--muted); display: flex; gap: 16px; }

    .comments-section { padding: 20px 16px 40px; }
    .comments-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; }

    .comment-form {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 28px;
    }
    .comment-form h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

    input, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 13px; color: var(--text);
      font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 95px; resize: vertical; margin-bottom: 12px; }

    .turnstile-wrapper { margin: 14px 0 16px; }
    .btn {
      background: var(--accent); color: white; border: none;
      border-radius: 999px; padding: 9px 22px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-note { font-size: 12px; color: var(--muted); margin-top: 12px; }

    .comment { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .comment:last-child { border-bottom: none; }
    .comment-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #2a2a2a;
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 13px; flex-shrink: 0;
    }
    .comment-body { flex: 1; }
    .comment-author { font-weight: 700; font-size: 14px; }
    .comment-time { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .comment-text { font-size: 15px; line-height: 1.5; margin-top: 6px; white-space: pre-wrap; }

    .no-comments { text-align: center; color: var(--muted); padding: 36px 0; font-size: 14px; }
    .state { padding: 80px 24px; text-align: center; color: var(--muted); }

    @media (max-width: 640px) {
      .container { border-left: none; border-right: none; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="thoughts.html" class="back-btn">←</a>
      <div class="header-title">Thought</div>
    </header>

    <div id="thought-container">
      <div class="state">Loading...</div>
    </div>

    <div class="comments-section">
      <div class="comments-title">Comments</div>

      <div class="comment-form">
        <h3>Leave a comment</h3>
        <form id="comment-form">
          <div class="form-row">
            <input type="text" id="comment-name" placeholder="Your name" required>
            <input type="email" id="comment-email" placeholder="Email (private)" required>
          </div>
          <textarea id="comment-content" placeholder="Write your comment..." required></textarea>
          <div class="turnstile-wrapper">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEzIMpMvx-Bdhkvd" data-theme="dark"></div>
          </div>
          <button type="submit" class="btn" id="submit-btn">Post Comment</button>
          <p class="form-note">Your email will not be published. Comments are moderated.</p>
        </form>
      </div>

      <div id="comments-list">
        <div class="no-comments">Loading comments...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://thoughts-api.irfanfitratyousafzai.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');
    let currentPost = null;

    async function loadThought() {
      const container = document.getElementById('thought-container');
      if (!slug) {
        container.innerHTML = `<div class="state">Thought not found</div>`;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(slug)}`);
        const data = await res.json();

        if (!data.post) {
          container.innerHTML = `<div class="state">Thought not found</div>`;
          return;
        }

        currentPost = data.post;
        document.title = currentPost.title + " | Irfan Fitrat";

        container.innerHTML = `
          <div class="thought">
            <div class="thought-header">
              <div class="avatar">IF</div>
              <div class="user-meta">
                <div class="name">Irfan Fitrat</div>
                <div class="handle">@irfanfitrat</div>
              </div>
            </div>
            <div class="thought-content">${escapeHtml(currentPost.content)}</div>
            ${currentPost.cover_image ? `
              <div class="thought-image">
                <img src="${currentPost.cover_image}" alt="">
              </div>
            ` : ''}
            <div class="thought-time">${formatFullDate(currentPost.published_at || currentPost.created_at)}</div>
            <div class="thought-stats">
              <span>${currentPost.views || 0} views</span>
              <span>${data.comments?.length || 0} comments</span>
            </div>
          </div>
        `;

        renderComments(data.comments || []);
      } catch (err) {
        container.innerHTML = `<div class="state">Unable to load thought</div>`;
      }
    }

    function renderComments(comments) {
      const list = document.getElementById('comments-list');
      if (!comments.length) {
        list.innerHTML = `<div class="no-comments">No comments yet. Be the first to reply.</div>`;
        return;
      }

      list.innerHTML = comments.map(c => `
        <div class="comment">
          <div class="comment-avatar">${(c.name || "A").charAt(0).toUpperCase()}</div>
          <div class="comment-body">
            <div class="comment-author">${escapeHtml(c.name)}</div>
            <div class="comment-time">${formatTime(c.created_at)}</div>
            <div class="comment-text">${escapeHtml(c.content)}</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('comment-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!currentPost) return;

      const name = document.getElementById('comment-name').value.trim();
      const email = document.getElementById('comment-email').value.trim();
      const content = document.getElementById('comment-content').value.trim();
      const turnstileToken = document.querySelector('input[name="cf-turnstile-response"]')?.value;

      if (!name || !email || !content) return;
      if (!turnstileToken) {
        alert("Please complete the captcha.");
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = "Posting...";

      try {
        const res = await fetch(`${API_BASE}/api/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            post_id: currentPost.id,
            name, email, content, turnstileToken
          })
        });

        const data = await res.json();
        if (res.ok) {
          alert("Comment submitted! It will appear after moderation.");
          this.reset();
          if (window.turnstile) window.turnstile.reset();
        } else {
          alert(data.error || "Failed to submit comment.");
        }
      } catch (err) {
        alert("Error submitting comment.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Post Comment";
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function formatTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatFullDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleString('en-US', {
        hour: 'numeric', minute: '2-digit', hour12: true,
        month: 'short', day: 'numeric', year: 'numeric'
      });
    }

    loadThought();
  </script>
</body>
</html>
