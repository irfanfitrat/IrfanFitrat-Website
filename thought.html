<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought | Irfan Fitrat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #161616;
      --border: #2f2f2f;
      --text: #e7e9ea;
      --muted: #71767b;
      --hover: #1a1a1a;
      --accent: #1d9bf0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 53px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-btn {
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: var(--hover);
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    /* Main Thought */
    .thought {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .thought-header {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1d9bf0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name {
      font-weight: 700;
      font-size: 16px;
    }

    .handle {
      font-size: 14px;
      color: var(--muted);
    }

    .thought-content {
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
    }

    .thought-time {
      font-size: 14px;
      color: var(--muted);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .thought-stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: var(--muted);
      padding-bottom: 12px;
    }

    /* Comments Section */
    .comments-section {
      padding: 16px;
    }

    .comments-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* Comment Form */
    .comment-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .comment-form h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .form-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    /* Single Comment */
    .comment {
      display: flex;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .comment:last-child {
      border-bottom: none;
    }

    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #333;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }

    .comment-body {
      flex: 1;
    }

    .comment-author {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .comment-time {
      font-size: 13px;
      color: var(--muted);
    }

    .comment-text {
      font-size: 15px;
      line-height: 1.45;
      margin-top: 4px;
      white-space: pre-wrap;
    }

    .no-comments {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
      font-size: 14px;
    }

    .state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .container {
        border-left: none;
        border-right: none;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <a href="thoughts.html" class="back-btn">←</a>
      <div class="header-title">Thought</div>
    </header>

    <!-- Main Thought -->
    <div id="thought-container">
      <div class="state">Loading...</div>
    </div>

    <!-- Comments -->
    <div class="comments-section">
      <div class="comments-title">Comments</div>

      <!-- Comment Form -->
      <div class="comment-form">
        <h3>Leave a comment</h3>
        <form id="comment-form">
          <div class="form-row">
            <input type="text" id="comment-name" placeholder="Your name" required>
            <input type="email" id="comment-email" placeholder="Email (private)" required>
          </div>
          <textarea id="comment-content" placeholder="Write your comment..." required></textarea>
          <button type="submit" class="btn">Post Comment</button>
          <p class="form-note">Your email will not be published. Comments are moderated.</p>
        </form>
      </div>

      <!-- Comments List -->
      <div id="comments-list">
        <div class="no-comments">Loading comments...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://thoughts-api.irfanfitratyousafzai.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    let currentPost = null;

    async function loadThought() {
      const container = document.getElementById('thought-container');

      if (!slug) {
        container.innerHTML = `<div class="state">Thought not found</div>`;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/posts/${encodeURIComponent(slug)}`);
        const data = await res.json();

        if (!data.post) {
          container.innerHTML = `<div class="state">Thought not found</div>`;
          return;
        }

        currentPost = data.post;
        document.title = currentPost.title + " | Irfan Fitrat";

        container.innerHTML = `
          <div class="thought">
            <div class="thought-header">
              <div class="avatar">IF</div>
              <div class="user-meta">
                <div class="name">Irfan Fitrat</div>
                <div class="handle">@irfanfitrat</div>
              </div>
            </div>
            <div class="thought-content">${escapeHtml(currentPost.content)}</div>
            <div class="thought-time">${formatFullDate(currentPost.published_at || currentPost.created_at)}</div>
            <div class="thought-stats">
              <span>${data.comments?.length || 0} Comments</span>
            </div>
          </div>
        `;

        renderComments(data.comments || []);
      } catch (err) {
        container.innerHTML = `<div class="state">Unable to load thought</div>`;
      }
    }

    function renderComments(comments) {
      const list = document.getElementById('comments-list');

      if (!comments.length) {
        list.innerHTML = `<div class="no-comments">No comments yet. Be the first to reply.</div>`;
        return;
      }

      list.innerHTML = comments.map(c => `
        <div class="comment">
          <div class="comment-avatar">${(c.name || "A").charAt(0).toUpperCase()}</div>
          <div class="comment-body">
            <div class="comment-author">${escapeHtml(c.name)}</div>
            <div class="comment-time">${formatTime(c.created_at)}</div>
            <div class="comment-text">${escapeHtml(c.content)}</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('comment-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!currentPost) return;

      const name = document.getElementById('comment-name').value.trim();
      const email = document.getElementById('comment-email').value.trim();
      const content = document.getElementById('comment-content').value.trim();

      if (!name || !email || !content) return;

      try {
        const res = await fetch(`${API_BASE}/api/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            post_id: currentPost.id,
            name,
            email,
            content
          })
        });

        if (res.ok) {
          alert("Comment submitted! It will appear after moderation.");
          this.reset();
        } else {
          alert("Failed to submit comment.");
        }
      } catch (err) {
        alert("Error submitting comment.");
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diff = (now - d) / 1000;

      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatFullDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    loadThought();
  </script>
</body>
</html>
