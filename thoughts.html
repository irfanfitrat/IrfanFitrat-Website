<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thoughts | Irfan Fitrat</title>
  <meta name="description" content="Short thoughts and observations by Irfan Fitrat.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #161616;
      --border: #2f2f2f;
      --text: #e7e9ea;
      --muted: #71767b;
      --hover: #1a1a1a;
      --accent: #1d9bf0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Layout */
    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 53px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
    }

    .header-link {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .header-link:hover {
      color: var(--text);
    }

    /* Post */
    .post {
      display: block;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .post:hover {
      background: var(--hover);
    }

    .post-header {
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1d9bf0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .name {
      font-weight: 700;
      font-size: 15px;
    }

    .handle {
      font-size: 14px;
      color: var(--muted);
    }

    .post-content {
      margin-left: 52px;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .post-footer {
      margin-left: 52px;
      display: flex;
      gap: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .post-footer span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Empty & Loading */
    .state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    /* Mobile */
    @media (max-width: 640px) {
      .container {
        border-left: none;
        border-right: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-title">Thoughts</div>
      <a href="index.html" class="header-link">← Website</a>
    </header>

    <!-- Feed -->
    <div id="feed">
      <div class="state">Loading thoughts...</div>
    </div>
  </div>

  <script>
    const API_BASE = "https://thoughts-api.irfanfitratyousafzai.workers.dev";

    async function loadThoughts() {
      const feed = document.getElementById('feed');

      try {
        const res = await fetch(`${API_BASE}/api/posts`);
        const posts = await res.json();

        if (!posts || posts.length === 0) {
          feed.innerHTML = `<div class="state">No thoughts yet.</div>`;
          return;
        }

        feed.innerHTML = posts.map(post => `
          <a href="thought.html?slug=${encodeURIComponent(post.slug)}" class="post">
            <div class="post-header">
              <div class="avatar">IF</div>
              <div class="user-meta">
                <div class="name">Irfan Fitrat</div>
                <div class="handle">@irfanfitrat · ${formatTime(post.published_at || post.created_at)}</div>
              </div>
            </div>
            <div class="post-content">${escapeHtml(post.excerpt || post.title)}</div>
            <div class="post-footer">
              <span>View thought</span>
            </div>
          </a>
        `).join('');
      } catch (err) {
        feed.innerHTML = `<div class="state">Unable to load thoughts.</div>`;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diff = (now - d) / 1000;

      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd';

      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    loadThoughts();
  </script>
</body>
</html>
