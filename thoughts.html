<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thoughts | Irfan Fitrat</title>
  <meta name="description" content="Personal thoughts, observations and ideas by Irfan Fitrat on business, opportunity, Pakistan, UAE and building bridges between markets.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --white: #ffffff;
      --black: #111111;
      --soft: #f5f5f2;
      --grey: #777777;
      --line: #e5e5e5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: white;
      color: var(--black);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Header - matching your website */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 8%;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(18px);
    }

    .logo img {
      height: 28px;
      width: auto;
      display: block;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 11px;
      letter-spacing: 0.22em;
      margin-left: 36px;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    nav a:hover { color: #111; }

    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px;
    }

    .menu-toggle span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: #111;
      transition: 0.3s;
    }

    .menu-toggle.active span:nth-child(1) {
      transform: translateY(7.5px) rotate(45deg);
    }
    .menu-toggle.active span:nth-child(2) { opacity: 0; }
    .menu-toggle.active span:nth-child(3) {
      transform: translateY(-7.5px) rotate(-45deg);
    }

    /* Hero */
    .thoughts-hero {
      padding: 180px 8% 90px;
      background: #111;
      color: white;
    }

    .thoughts-hero .section-title {
      font-size: 13px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 24px;
    }

    .thoughts-hero h1 {
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 1.1;
      max-width: 800px;
      margin-bottom: 24px;
    }

    .thoughts-hero p {
      font-size: 18px;
      color: #aaa;
      max-width: 560px;
      line-height: 1.7;
    }

    /* Feed */
    .thoughts-feed {
      max-width: 780px;
      margin: 0 auto;
      padding: 80px 8% 120px;
    }

    .thought-card {
      padding: 40px 0;
      border-bottom: 1px solid var(--line);
      transition: opacity 0.3s;
    }

    .thought-card:first-child {
      padding-top: 0;
    }

    .thought-card:last-child {
      border-bottom: none;
    }

    .thought-meta {
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 16px;
    }

    .thought-card h2 {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.35;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .thought-card h2 a {
      color: var(--black);
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .thought-card h2 a:hover {
      opacity: 0.7;
    }

    .thought-excerpt {
      font-size: 17px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .read-more {
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      border-bottom: 1px solid var(--black);
      padding-bottom: 2px;
      transition: opacity 0.3s;
    }

    .read-more:hover {
      opacity: 0.6;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #888;
    }

    .empty-state p {
      font-size: 17px;
    }

    /* Footer */
    footer {
      background: #111;
      color: #777;
      padding: 40px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.28em;
    }

    .footer-links {
      display: flex;
      gap: 28px;
    }

    .footer-links a {
      color: #777;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-links a:hover { color: white; }

    /* WhatsApp */
    .whatsapp-float {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 9998;
      width: 60px;
      height: 60px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
    }

    .whatsapp-float:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 32px rgba(37, 211, 102, 0.45);
    }

    .whatsapp-float svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    /* Mobile */
    @media (max-width: 900px) {
      nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 100%;
        height: 100vh;
        background: #111;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 36px;
        transition: right 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
        z-index: 999;
      }

      nav.open { right: 0; }

      nav a {
        color: white;
        font-size: 18px;
        margin: 0;
      }

      .menu-toggle {
        display: flex;
        z-index: 1001;
      }

      .menu-toggle.active span { background: white; }

      header { padding: 18px 6%; }
      .thoughts-hero, .thoughts-feed { padding-left: 6%; padding-right: 6%; }

      footer {
        flex-direction: column;
        gap: 24px;
        text-align: center;
      }

      .footer-links { justify-content: center; }
    }
  </style>
</head>
<body>

  <script>
    // Mobile menu
    const menuToggle = document.querySelector(".menu-toggle");
    const mainNav = document.getElementById("main-nav");

    menuToggle.addEventListener("click", () => {
      menuToggle.classList.toggle("active");
      mainNav.classList.toggle("open");
      document.body.style.overflow = mainNav.classList.contains("open") ? "hidden" : "";
    });

    mainNav.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        menuToggle.classList.remove("active");
        mainNav.classList.remove("open");
        document.body.style.overflow = "";
      });
    });

    // Load Thoughts (currently from localStorage - will connect to Worker later)
    function loadThoughts() {
      const posts = JSON.parse(localStorage.getItem('thoughts_posts') || '[]');
      const published = posts.filter(p => p.status === 'published');
      const container = document.getElementById('thoughts-list');

      if (published.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No thoughts published yet.</p>
          </div>`;
        return;
      }

      // Sort newest first
      published.sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));

      container.innerHTML = published.map(post => `
        <article class="thought-card">
          <div class="thought-meta">${formatDate(post.published_at || post.created_at)}</div>
          <h2><a href="thought.html?slug=${post.slug}">${escapeHtml(post.title)}</a></h2>
          <p class="thought-excerpt">${escapeHtml(post.excerpt || post.content.substring(0, 180) + '...')}</p>
          <a href="thought.html?slug=${post.slug}" class="read-more">Read Thought</a>
        </article>
      `).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    loadThoughts();
  </script>
